# ===============================
# ENV
# ===============================
set env_name "dev"            # dev | staging | prod

# ===============================
# SERVER IDENTITY
# ===============================
sv_hostname "ProjectPhoenix DEV"
sv_maxclients 7
sets tags "default, qbcore, dev"
sets locale "en-US"
sets sv_projectName "Project Phoenix"
sets sv_projectDesc "Advanced FiveM RP framework"

# ===============================
# CFX / FIVEM
# ===============================
sv_licenseKey "REPLACE_WITH_CFX_KEY"
set steam_webApiKey "none"
set sv_enforceGameBuild 2802

# ===============================
# DATABASE
# ===============================
set mysql_connection_string "mysql://USER:PASSWORD@localhost/projectphoenix_dev"

# ===============================
# VOICE (PMA)
# ===============================
setr voice_useNativeAudio 1
setr voice_useSendingRangeOnly 1
setr voice_zoneRadius 300
setr voice_enableUi 1
setr voice_enableRadios 1
setr voice_enablePhones 1
setr voice_defaultCycle "`"
setr voice_defaultRadio "CAPS"

# ===============================
# QBCORE
# ===============================
setr qb_locale "en"
setr UseTarget true

# ===============================
# PERMISSIONS
# ===============================
add_principal identifier.fivem:CHANGE_ME group.admin
add_ace resource.qb-core command allow
add_ace qbcore.god command allow

# ===============================
# OPTIONAL / LOCAL RESOURCES
# ===============================
# ensure PLOKS_CARS
# ensure VehicleSpawner

